spring:
  application:
    name: LibraryManagement
  datasource:
    url: jdbc:postgresql://localhost:5433/library_db
    username: library
    password: library
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: en
    locale-resolver: accept-header